<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>秦腔邀请函</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2b2118;
    overscroll-behavior: none;
}

/* 电脑上看的时候居中显示一个手机比例的框 */
#wrap {
    position: fixed;
    left: 0; top: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

#phone {
    position: relative;
    width: 640px;
    height: 1040px;
    max-width: 100vw;
    max-height: 100vh;
    overflow: hidden;
    background: #efe7d2;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

/* 4页竖着排，翻页就是整个容器往上移 */
#list {
    width: 100%;
    height: 100%;
    transition: transform .45s ease-out;
}
#list.moving { transition: none; }

.page {
    width: 100%;
    height: 100%;
}
.page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    /* 不然拖动的时候会拖出一张半透明的图 */
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
}

/* 右侧圆点 */
#dots {
    position: absolute;
    right: 14px;
    top: 50%;
    margin-top: -50px;
    z-index: 20;
}
#dots span {
    display: block;
    width: 9px;
    height: 9px;
    margin: 12px 0;
    border-radius: 50%;
    background: rgba(120,40,40,.3);
    border: 1px solid rgba(255,255,255,.85);
    cursor: pointer;
    transition: all .3s;
}
#dots span.on {
    height: 26px;
    border-radius: 5px;
    background: #a4231f;
    margin: 4px 0;
}

/* 底部两个翻页按钮 */
.btn {
    position: absolute;
    bottom: 24px;
    left: 50%;
    margin-left: -23px;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 50%;
    background: rgba(164,35,31,.85);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 20;
}
.btn:active { transform: scale(.9); }
.btn.hide { display: none; }

/* 第一页的滑动提示 */
#tip {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: #8a1f1c;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(255,250,235,.6);
    z-index: 19;
    pointer-events: none;
    animation: updown 1.8s infinite;
}
#tip.gone { display: none; }

@keyframes updown {
    0%,100% { margin-bottom: 0; }
    50% { margin-bottom: 8px; }
}
</style>
</head>
<body>

<div id="wrap">
    <div id="phone">
        <div id="list">
            <div class="page"><img src="img/01.jpg" alt="封面"></div>
            <div class="page"><img src="img/02.jpg" alt="安排"></div>
            <div class="page"><img src="img/03.jpg" alt="活动"></div>
            <div class="page"><img src="img/04.jpg" alt="报名"></div>
        </div>

        <div id="dots">
            <span class="on"></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <button class="btn hide" id="btnUp">&#9650;</button>
        <button class="btn" id="btnDown">&#9660;</button>

        <div id="tip">上滑查看下一页</div>
    </div>
</div>

<script>
var list = document.getElementById('list');
var phone = document.getElementById('phone');
var dotEls = document.querySelectorAll('#dots span');
var btnUp = document.getElementById('btnUp');
var btnDown = document.getElementById('btnDown');
var tip = document.getElementById('tip');

var TOTAL = 4;
var cur = 0;          // 当前第几页
var startY = 0;
var moveY = 0;
var isDrag = false;

function show() {
    list.style.transform = 'translateY(' + (-cur * 100) + '%)';

    for (var i = 0; i < dotEls.length; i++) {
        dotEls[i].className = (i === cur) ? 'on' : '';
    }
    // 第一页不显示上翻，最后一页不显示下翻
    btnUp.className = (cur === 0) ? 'btn hide' : 'btn';
    btnDown.className = (cur === TOTAL - 1) ? 'btn hide' : 'btn';

    if (cur > 0) {
        tip.className = 'gone';
    }
}

function goPage(n) {
    if (n < 0) n = 0;
    if (n > TOTAL - 1) n = TOTAL - 1;
    if (n === cur) return;
    cur = n;
    show();
}

btnDown.onclick = function () { goPage(cur + 1); };
btnUp.onclick = function () { goPage(cur - 1); };

for (var i = 0; i < dotEls.length; i++) {
    (function (n) {
        dotEls[n].onclick = function () { goPage(n); };
    })(i);
}

// 手指按下
phone.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    isDrag = true;
    startY = e.touches[0].clientY;
    moveY = 0;
    list.className = 'moving';
}, { passive: true });

// 拖动中，跟着手指走
phone.addEventListener('touchmove', function (e) {
    if (!isDrag) return;
    moveY = e.touches[0].clientY - startY;

    // 第一页往上拉、最后一页往下拉，加个阻尼不让拉穿
    if ((cur === 0 && moveY > 0) || (cur === TOTAL - 1 && moveY < 0)) {
        moveY = moveY * 0.35;
    }
    var base = -cur * phone.clientHeight;
    list.style.transform = 'translateY(' + (base + moveY) + 'px)';

    if (Math.abs(moveY) > 6) e.preventDefault();
}, { passive: false });

// 松手，滑够 1/4 屏就翻页
phone.addEventListener('touchend', function () {
    if (!isDrag) return;
    isDrag = false;
    list.className = '';

    var h = phone.clientHeight;
    if (moveY < -h / 4) {
        goPage(cur + 1);
    } else if (moveY > h / 4) {
        goPage(cur - 1);
    } else {
        show();  // 没滑够就弹回去
    }
});

// 电脑上滚轮也能翻，方便自己调
var wheelLock = false;
phone.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    setTimeout(function () { wheelLock = false; }, 500);

    if (e.deltaY > 0) goPage(cur + 1);
    else goPage(cur - 1);
}, { passive: false });

show();

// TODO: 04页里的电话和公众号还是占位的，发布前要换成真的
</script>
</body>
</html>
